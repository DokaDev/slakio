# cargo-about (https://embarkstudios.github.io/cargo-about/): the notices of every third-party
# crate built into slakio, generated by scripts/third-party-notices.sh as
# THIRD-PARTY-NOTICES.html from about.hbs. The accepted list mirrors deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# The release targets: the notices of what ships on them.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# ring's license file holds several licenses; cargo-about's workaround reads it as they are.
workarounds = ["ring"]
# The notices of what ships in the binary, not of test-only tools.
ignore-dev-dependencies = true
ignore-build-dependencies = false
# The workspace's own crates (publish = false) are slakio itself, not third-party code.
private = { ignore = true }
