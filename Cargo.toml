[workspace]
resolver = "3"
members = [
    "crates/slakio-core",
    "crates/slakio-world",
    "crates/slakio-slack",
    "crates/slakio-auth",
    "crates/slakio-fake",
    "crates/slakio-tui",
    "crates/slakio-bench",
]
# cargo-fuzz targets need nightly; they build on their own (fuzz/Cargo.toml).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "An unofficial terminal client for Slack (early development; not affiliated with Slack)"
repository = "https://github.com/DokaDev/slakio"
homepage = "https://github.com/DokaDev/slakio"
readme = "README.md"
keywords = ["slack", "tui", "terminal", "chat"]
categories = ["command-line-utilities"]
# Not published anywhere until it can connect to a workspace.
publish = false

[workspace.dependencies]
# Internal crates. Dependency direction (docs/architecture.md, checked in CI):
# tui -> core <- adapters; adapters never depend on each other or on tui; bench -> all.
# slakio-fake is a dev-dependency only.
slakio-auth = { path = "crates/slakio-auth" }
slakio-core = { path = "crates/slakio-core" }
slakio-fake = { path = "crates/slakio-fake" }
slakio-slack = { path = "crates/slakio-slack" }
slakio-tui = { path = "crates/slakio-tui" }
slakio-world = { path = "crates/slakio-world" }

# The Slack transport's HTTP/1.1 client (docs/architecture/0001-http-stack.md): hyper's
# connection API without its pooled client, so the transport decides every header and its order.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# TLS to Slack's hosts: rustls with the ring provider, the OS's own certificate verifier (macOS
# Security framework, Windows CryptoAPI, Linux rustls-native-certs): no bundled root list.
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.7.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# The tests' certificates for a TLS server on this machine, made when they run.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The macOS Keychain (the login keychain's generic passwords) behind the secret store.
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
keyring-core = "1"
# Desktop-app sign-in (slakio-auth, macOS only): reading the app's encrypted Cookies database
# (SQLite, on a temp copy), the per-workspace tokens from its Local Storage (a Chromium
# LevelDB), and decrypting the `d` cookie (AES-128-CBC with a PBKDF2-SHA1 key).
rusqlite = { version = "0.37", features = ["bundled"] }
rusty-leveldb = { version = "3", default-features = false, features = ["fs"] }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
sha1 = { version = "0.10", default-features = false }
# Secrets (pasted text, credentials) are wiped from memory when dropped.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }
# Decoding Slack's JSON answers, tolerantly (unknown fields ignored, most fields optional).
serde = { version = "1", features = ["derive"] }

# Terminal input and output for Ratatui; `event-stream` for the async event loop.
crossterm = { version = "0.29", features = ["event-stream"] }
# `StreamExt` over crossterm's event stream, and `select_all` over the signal streams.
futures = "0.3"
# Slack's emoji shortcodes (`:+1:`, `:white_check_mark:`, skin tones) as Unicode emoji (gemoji
# data; MIT OR Apache-2.0, Unicode-3.0).
emojis = "0.9"
# Property tests of the sanitiser and the pure models, on the stable toolchain.
proptest = { version = "1", default-features = false, features = ["std"] }
# Snapshot tests of rendered screens (English only, never rewritten under CI).
insta = "1.48.0"
# The command line (`--help`, `--version`, `--config`): a small parser with no dependencies,
# instead of a hand-rolled one or a large derive-based crate.
lexopt = "0.3"
ratatui = "0.30"
# The bench crate's JSONL output and the binary's stats file.
serde_json = "1.0.151"
# The terminal's background (OSC 11, light or dark) for the themes with a light and a dark
# variant; asked once at startup, before the event stream reads stdin.
terminal-colorsaurus = "1.0.3"
tokio = "1"
# Reading the locale catalogs in build.rs and the budgets of the bench crate.
toml = "1.1.6"
# The config file and the one-time notices file: read and written keeping comments and order.
toml_edit = "0.25"
# Grapheme clusters and their display widths, the same functions Ratatui's buffer uses, so
# wrapped message text and the composer's cursor line up with what is drawn.
unicode-segmentation = "1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# A lint is silenced only with `#[expect(…, reason = "…")]`, which fails once the lint no longer
# fires; `#[allow]` is refused, so nothing is silenced for good without a word.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
too_many_lines = "warn"

# A single codegen unit with LTO drops the code no caller reaches, and stripping drops the
# symbol table (panic messages keep their file and line); the binary size is a budget
# (crates/slakio-bench/budgets.toml).
[profile.release]
lto = true
codegen-units = 1
strip = true
