# The English message catalog: the source of every key (see docs/architecture.md, "UI strings
# (i18n)"). A key is lowercase words joined by `.` or `_`; `{name}` is a placeholder. Every key
# must be translated in ko.toml; the build fails otherwise.

# Mode badge at the left of the status line.
"mode.normal" = "NORMAL"
"mode.command" = "COMMAND"
"mode.insert" = "INSERT"
