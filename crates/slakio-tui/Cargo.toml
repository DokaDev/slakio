[package]
name = "slakio-tui"
description = "slakio terminal UI (Ratatui) and the `slakio` binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "slakio_tui"

[[bin]]
name = "slakio"
path = "src/main.rs"

[dependencies]
crossterm.workspace = true
emojis.workspace = true
futures.workspace = true
lexopt.workspace = true
ratatui.workspace = true
# Signing in (the binary's wiring only, as the transport).
slakio-auth.workspace = true
slakio-core.workspace = true
# Named by the binary's wiring only (src/main.rs); the library reaches a backend through the
# core's protocol.
slakio-slack.workspace = true
# The local cache (the binary's wiring only).
slakio-store.workspace = true
# The invented world behind `--demo`.
slakio-world.workspace = true
terminal-colorsaurus.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "signal"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
# The binary signing in against the tests' fake Slack.
slakio-fake.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
