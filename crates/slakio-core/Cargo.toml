[package]
name = "slakio-core"
description = "UI-free and network-free core of slakio: domain model, backend protocol, paths, files, config, secrets, faults, i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# No UI crates (ratatui/crossterm), no network, no database here (docs/architecture.md).
[dependencies]
# Channels only (the backend handle): no runtime, no network.
tokio = { workspace = true, features = ["sync"] }
# Theme files: read strictly (unknown keys refused) with the line of each problem (`Spanned`).
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
zeroize.workspace = true
# Emoji names: a mark that joins the character before it is no letter of a shortcode.
unicode-segmentation.workspace = true
# The pictures kept on disk are keyed by SHA-256 (ring, already in the binary for TLS).
ring.workspace = true

# The error log opened without following a symbolic link (`O_NOFOLLOW`, Unix).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix.workspace = true

# build.rs: checks the locale catalogs and generates the typed message API.
[build-dependencies]
toml.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
