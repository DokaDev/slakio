name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes; pushes to main all run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Nothing in CI may touch an OS keychain.
  SLAKIO_SECRET_STORE: memory

# The toolchain (pinned, with rustfmt and clippy) comes from rust-toolchain.toml; rustup on the
# hosted runners installs it on the first cargo invocation.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  # On every OS the tests run on: code behind `cfg(unix)` / `cfg(windows)` warns differently.
  clippy:
    name: clippy -D warnings (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # Every test target of every crate, so a new test file can never be left out: the i18n
      # catalog checks (the build itself), the generated docs/keybindings.md, the screen
      # snapshots (insta never rewrites them under CI) and, on Linux and macOS, the binary in a
      # pseudo terminal. --no-fail-fast: a failing test target does not hide the failures of
      # the targets after it.
      - run: cargo test --workspace --locked --no-fail-fast
        env:
          # The pseudo-terminal tests (Linux and macOS; they do not build on Windows) fail
          # instead of skipping when `script` cannot start.
          SLAKIO_REQUIRE_PTY: "1"

  # No Hangul outside the values of locales/ko.toml, no old project name, no absolute home paths,
  # the ratchet on file sizes, and the rules on the pushed commits.
  repo-rules:
    name: repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The pushed commits, for the rules on them.
          fetch-depth: 0
      - run: bash .github/scripts/repo-rules.sh
      # The guard scripts' own tests, in throwaway repositories.
      - run: bash .github/scripts/test-guards.sh
      # Commit subjects, refactors without snapshot changes, an allowlist that only shrinks (per
      # commit), guard changes named in the pull request's body or flagged.
      - name: Rules on the pushed commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          PR: ${{ github.event_name == 'pull_request' }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/history-rules.sh "$BASE"

  # tui -> core <- adapters (docs/architecture.md, "Dependency rules").
  dependency-direction:
    name: dependency direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/dependency-direction.sh

  # Count budgets of the release binary (docs/perf.md): its size, and wakeups and frames per
  # second while idle. The binary runs in tmux on a server of its own (`-L slakio-perf`).
  perf:
    name: performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update && sudo apt-get install -y tmux
          fi
      - run: cargo build --release --locked -p slakio-tui -p slakio-bench
      - run: ./target/release/slakio-bench budget --scratch "$RUNNER_TEMP/slakio-perf" --out "$RUNNER_TEMP/perf.jsonl"
      - name: Measurements
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/perf.jsonl" || true

  # Licenses (permissive only), advisories, bans and sources: deny.toml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # RustSec advisories once more with cargo-audit; judged ones are listed with the reason in
  # .cargo/audit.toml (and in deny.toml).
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo audit

  # THIRD-PARTY-NOTICES.html for the release archives (cargo-about, about.toml, about.hbs).
  notices:
    name: third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install --locked cargo-about --version 0.9.2 --features cli
      - run: scripts/third-party-notices.sh
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.html

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color
